name: Build SPFx PMO Dashboard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Use Ubuntu runner with a Node 10 Docker container —
    # this guarantees the exact right Node version without relying on setup-node.
    runs-on: ubuntu-latest
    container:
      image: node:10.24.1-buster-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show Node & npm versions
        run: |
          node --version
          npm --version

      # Full install (no --ignore-scripts): node-sass downloads its own prebuilt
      # Linux binary automatically on Node 10, no compilation required.
      - name: Install dependencies
        run: npm install
        env:
          SASS_BINARY_SITE: https://github.com/sass/node-sass/releases/download

      - name: Bundle (production)
        run: node_modules/.bin/gulp bundle --ship

      - name: Package solution
        run: node_modules/.bin/gulp package-solution --ship

      - name: Upload .sppkg artifact
        uses: actions/upload-artifact@v3
        with:
          name: pmo-dashboard-sppkg
          path: sharepoint/solution/pmo-dashboard.sppkg
          retention-days: 30
