name: Build SPFx PMO Dashboard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Check out the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Use Node 10 — required for SPFx 1.11 + gulp 3
      - name: Setup Node.js 10
        uses: actions/setup-node@v3
        with:
          node-version: '10.24.1'

      # 3. Install dependencies (skip native build scripts, we provide prebuilt sass binary)
      - name: Install dependencies
        run: npm install --ignore-scripts
        env:
          SASS_BINARY_SITE: https://github.com/sass/node-sass/releases/download

      # 4. Rebuild node-sass with the correct prebuilt binary for Node 10
      - name: Rebuild node-sass
        run: node node_modules/node-sass/scripts/install.js
        env:
          SASS_BINARY_SITE: https://github.com/sass/node-sass/releases/download

      # 5. Bundle for production (minify + tree-shake)
      - name: Bundle (production)
        run: .\node_modules\.bin\gulp bundle --ship
        shell: pwsh

      # 6. Package into .sppkg
      - name: Package solution
        run: .\node_modules\.bin\gulp package-solution --ship
        shell: pwsh

      # 7. Upload .sppkg as a downloadable artifact
      - name: Upload .sppkg artifact
        uses: actions/upload-artifact@v3
        with:
          name: pmo-dashboard-sppkg
          path: sharepoint/solution/pmo-dashboard.sppkg
          retention-days: 30
